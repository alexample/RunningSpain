name: Actualizar carreras

on:
  schedule:
    # Las dos vueltas diarias las lanza el Worker de Cloudflare (dondeloechan-ia) a las 03:07 y 14:07 UTC.
    # Esta pasada de GitHub es solo un respaldo de madrugada por si el Worker fallara (GitHub a veces la retrasa).
    - cron: "41 22 * * *"
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  repository_dispatch:      # aviso del Worker de Cloudflare (dondeloechan-ia), más puntual que el horario de GitHub
    types: [robot]

permissions:
  contents: write

concurrency:
  group: actualizar-carreras
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar el robot
        env:
          # Opcional: si añades este secreto, el robot lee los reglamentos con IA (céntimos al mes).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.main

      # 1) Guardar los datos en cuanto termina la búsqueda: la web se actualiza sin esperar a los tweets.
      - name: Guardar los datos
        run: |
          git config user.name "runningspain-bot"
          git config user.email "runningspain-bot@users.noreply.github.com"
          git add docs/data/carreras.json
          [ -f estado/vistos.json ] && git add estado/vistos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar carreras $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push
          fi

      # 2) Después, los tweets (uno cada 90 segundos a MacroDroid).
      - name: Publicar carreras nuevas en X
        env:
          # Si faltan estos secretos, el paso no publica nada (y no falla).
          MACRODROID_WEBHOOK: ${{ secrets.MACRODROID_WEBHOOK }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python -m scraper.xpost

      # 3) Anotar qué carreras se han enviado ya (aunque el paso anterior fallara a medias).
      - name: Guardar lo publicado
        if: always()
        run: |
          [ -f estado/x.json ] || exit 0
          git add estado/x.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Tweets enviados $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push
          fi
