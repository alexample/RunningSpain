name: Diagnóstico de búsqueda

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scraper.diagnostico
      - name: Guardar
        run: |
          git config user.name "runningspain-bot"
          git config user.email "runningspain-bot@users.noreply.github.com"
          git add estado/diagnostico.json
          git commit -m "Diagnóstico de búsqueda" || exit 0
          git pull --rebase -X theirs origin main
          git push
