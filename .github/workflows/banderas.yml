name: Descargar banderas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  banderas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scraper.flags
      - name: Guardar
        run: |
          git config user.name "runningspain-bot"
          git config user.email "runningspain-bot@users.noreply.github.com"
          git add docs/flags
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Banderas de las comunidades"
            git pull --rebase origin main
            git push
          fi
