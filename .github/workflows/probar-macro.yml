name: Probar MacroDroid

# Envía una carrera real a la macro (sin anotarla como publicada). Solo a mano.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scraper.xpost --prueba-macro
        env:
          MACRODROID_WEBHOOK: ${{ secrets.MACRODROID_WEBHOOK }}
